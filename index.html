<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>사주 한눈에 보기</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>사주 한눈에 보기</h1>
        <p>
          생년월일과 출생 시간 등 기본 정보를 입력하면,
          간단한 사주 성향 리포트를 확인할 수 있어요.
        </p>
      </header>

      <section class="card">
        <form id="fortune-form">
          <div class="grid">
            <label>
              이름
              <input type="text" id="name" placeholder="예: 홍길동" required />
            </label>

            <label>
              성별
              <select id="gender" required>
                <option value="">선택하세요</option>
                <option value="남성">남성</option>
                <option value="여성">여성</option>
                <option value="기타">기타</option>
              </select>
            </label>

            <label>
              생년월일
              <input type="date" id="birth-date" required />
            </label>

            <label>
              출생 시간
              <input type="time" id="birth-time" required />
            </label>

            <label>
              태어난 지역
              <input type="text" id="birth-place" placeholder="예: 서울" required />
            </label>

            <label>
              양력/음력
              <select id="calendar" required>
                <option value="">선택하세요</option>
                <option value="양력">양력</option>
                <option value="음력">음력</option>
              </select>
            </label>
          </div>

          <button type="submit">사주 성향 보기</button>
        </form>
      </section>

      <section id="result" class="card hidden" aria-live="polite"></section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
